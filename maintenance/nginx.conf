# Port 80 : filet de sécurité pour les domaines sans service.
# 404 par défaut, 503 si le drapeau /flags/maintenance existe.
server {
    listen 80;
    root /usr/share/nginx/html;

    error_page 404 /404.html;
    error_page 503 /index.html;

    location = /404.html { internal; }
    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
    }

    location / {
        if (-f /flags/maintenance) { return 503; }
        return 404;
    }
}

# Port 8080 : toujours en maintenance (503).
# Traefik y envoie un site précis quand on le met en maintenance
# (voir traefik/dynamic/00-maintenance.yml).
server {
    listen 8080;
    root /usr/share/nginx/html;

    error_page 503 /index.html;

    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
    }

    location / { return 503; }
}
