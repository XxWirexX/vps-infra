<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · Page introuvable</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #777;
      --accent: #4f8ef7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 50% 35%, rgba(79, 142, 247, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    .code {
      font-size: clamp(5rem, 22vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #fff 0%, #555 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      margin-top: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }
    p {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .host {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.1rem 0.4rem;
      word-break: break-all;
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, transform 0.15s;
    }
    a:hover { background: #3a7de0; transform: translateY(-1px); }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Page introuvable</h1>
    <p>Rien à voir ici : <span class="host" id="host">cette adresse</span> ne mène nulle part.</p>
    <a href="https://wireredblue.xyz">Retour à l'accueil</a>
  </main>
  <script>
    document.getElementById("host").textContent = location.host + location.pathname;
  </script>
</body>
</html>
