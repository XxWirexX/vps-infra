entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: wireredblue.xyz
            sans:
              - "*.wireredblue.xyz"

providers:
  docker:
    exposedByDefault: false
    network: proxy
  # Routes gérées par fichiers (sous-domaines, maintenance par site).
  # Traefik surveille le dossier et recharge à chaud, sans redémarrage.
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: kylian.gagnon@free.fr
      storage: /acme/acme.json
      dnsChallenge:
        provider: ovh

api:
  dashboard: false

log:
  level: INFO
