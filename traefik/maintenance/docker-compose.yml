services:
  maintenance:
    image: nginx:alpine
    container_name: maintenance
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.maintenance.rule=PathPrefix(`/`)
      - traefik.http.routers.maintenance.priority=1
      - traefik.http.routers.maintenance.entrypoints=websecure
      - traefik.http.services.maintenance.loadbalancer.server.port=80

networks:
  proxy:
    external: true
